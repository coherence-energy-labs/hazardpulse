name: Tests

# Runs the trust/gate/calibration unit tests + the vendored-omega drift check on
# every push and PR. These gate the trust spine (calibration, conformal
# intervals, OOD/abstention, signed receipts, the publish-gate engine) so a
# regression can't reach the live scoring pipeline.

on:
  push:
    branches: [main, platform-trust-program]
  pull_request:
    branches: [main]
  # Daily, against main as the cron jobs leave it. The scorers' data commits are pushed with
  # GITHUB_TOKEN, which never triggers `push` workflows, so main's dist/ went untested from
  # 2026-08-01 to 2026-10-01 while test_site_integrity failed on every human push in between.
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # SHA-pinned from main -- a floating @v4 tag is a supply-chain hole, and this branch
        # predates the pinning. Keep the pin AND the depth the append-only gate needs.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The append-only gate compares this ref against origin/main, so it needs real history.
          # The default shallow clone has no merge base and the check would silently pass.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy pytest
          pip install -e .

      - name: Verify vendored omega_one trust subset has not drifted
        run: python scripts/vendor_omega_trust.py --verify

      - name: Run trust + gate + calibration + verifier tests
        run: |
          python -m pytest -q \
            tests/test_vendor_omega.py \
            tests/test_calibration.py \
            tests/test_venn_abers.py \
            tests/test_trusted_forecast.py \
            tests/test_gate_engine.py \
            tests/test_fit_calibration.py \
            tests/test_scoring_integration.py \
            tests/test_external_verify.py

      # BOTH sides kept. The branch added the accuracy/HRRR suite; main added the determinism gate,
      # the CLI smoke test and receipt verification. Neither replaces the other, and taking one side
      # would have deleted a whole class of checks from a workflow that still looked healthy.
      - name: Run accuracy + tornado-HRRR pipeline tests
        run: |
          python -m pytest -q \
            tests/test_hrrr_pooling.py \
            tests/test_group_conformal.py \
            tests/test_forest_serve.py \
            tests/test_tornado_hrrr_dataset.py \
            tests/test_tornado_hrrr_env.py \
            tests/test_eq_forest_wiring.py

      # Each of these failed on the code it guards before 2026-10: order-dependent AUC on
      # tied cells, the 20,000-row USGS truncation, risk bands contradicting calibrated
      # probabilities, the 400-day serving window, invented "no RI" hurricane outcomes,
      # and publish gates fed inputs that could not fail.
      - name: Verification-truth regression tests
        run: |
          python -m pytest -q \
            tests/test_ranking_metrics.py \
            tests/test_usgs_catalog_completeness.py \
            tests/test_risk_band_truth.py \
            tests/test_eq_history_window.py \
            tests/test_hurricane_verification.py \
            tests/test_gate_inputs.py \
            tests/test_earthquake_operational_forecast.py \
            tests/test_earthquake_operational_serving.py \
            tests/test_earthquake_program_metrics.py

      # The site quotes only numbers bound to the SERVED artifacts (2026-10: five pages had drifted to
      # five superseded models), the public tornado ledger keeps updating (it froze 2026-03-31 while
      # every run printed success), a storm's numbers are measured rather than invented, and live
      # verification scores v3 storms against the event v3 forecasts.
      - name: Served-model evidence, live tornado page and v3 verification tests
        run: |
          python -m pytest -q \
            tests/test_served_evidence.py \
            tests/test_tornado_page_evidence.py \
            tests/test_tornado_verify_v3.py \
            tests/test_reliability_table.py \
            tests/test_live_record_by_version.py \
            tests/test_verification_rollup.py \
            tests/test_build_writes_are_byte_stable.py \
            tests/test_platt_fit.py \
            tests/test_scoring_push.py

      - name: Determinism gate — identical training regardless of global RNG
        run: python -m pytest -q tests/test_determinism.py

      # Operational regressions: the hurricane job serves a pinned model and never trains
      # (it timed out daily from 2026-05-27), ingests only active storms with their true
      # identity, every scorer re-renders the cross-hazard pages, liveness is per hazard.
      - name: Ops regression tests (hurricane serving, live ingest, cross-hazard pages, liveness)
        run: |
          python -m pytest -q \
            tests/test_hurricane_ri_serving.py \
            tests/test_hurricane_training_clock.py \
            tests/test_hurricane_live_ingest.py \
            tests/test_cross_hazard_pages.py \
            tests/test_liveness.py

      - name: Smoke-test every documented CLI entry point
        run: |
          hazardpulse --help
          hazardpulse earthquake-v4 --help
          python -c "from hazardpulse.earthquake.v4_regional import main"

      - name: Verify committed forecast receipts (integrity, zero-trust verifier)
        run: |
          pip install cryptography
          ARTIFACT=$(ls dist/data/replay/eq_fcst_*.json | tail -n 1)
          echo "verifying $ARTIFACT"
          python scripts/verify_forecast.py --artifact "$ARTIFACT"

      - name: Run site integrity checks
        run: python -m pytest tests/test_site_integrity.py -q

      # The product's claim is "this prediction was recorded before the event". An append-only
      # evidence artifact that silently SHRINKS is indistinguishable from backdating. A long-lived
      # branch that regenerated these files at its fork point would have destroyed 547 records in
      # each of four ledgers, in a commit indistinguishable from a routine data update.
      - name: Append-only evidence ledgers must never lose records
        run: |
          set -eu
          python scripts/check_append_only_monotonic.py --self-test
          git fetch --no-tags --depth=0 origin main 2>/dev/null || git fetch --no-tags origin main
          python scripts/check_append_only_monotonic.py --base origin/main --head HEAD

      - name: Compile all scoring + training scripts
        run: |
          python -m py_compile \
            scripts/fetch_and_score_earthquake.py \
            scripts/fetch_and_score_tornado.py \
            scripts/fetch_and_score.py \
            scripts/train_hurricane_ri.py \
            scripts/evaluate_hurricane_ri.py \
            scripts/hurricane_ri_stack.py \
            scripts/build_hurricane_training_data.py \
            scripts/check_liveness.py \
            scripts/score_earthquake_prospective.py \
            scripts/score_tornado_prospective.py \
            scripts/score_hurricane_prospective.py \
            scripts/build_site_artifacts.py \
            scripts/fit_calibration.py \
            scripts/verify_forecast.py \
            scripts/train_best_tabular.py \
            scripts/retrain_and_deploy.py \
            scripts/build_tornado_hrrr_dataset.py \
            scripts/train_tornado_hrrr.py \
            scripts/score_tornado_hrrr_env.py
