name: Research -- precursor atlas run 4 (GPS)

# docs/PRECURSOR_ATLAS.md run 4 (tag prereg-precursor-atlas-4): Nevada Geodetic Laboratory daily GPS at the stations
# nearest each large earthquake, against the same stations at past-only control times. Downloads about 1 GB, so it
# runs here, not on a desk. Dispatch only; the result is an artifact, reviewed and committed by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gps:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install numpy && pip install -e .
      - name: Atlas run 4
        run: python scripts/research/precursor_atlas_4.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-4-gps
          path: results/precursor_atlas/atlas_4.json
          retention-days: 90
          if-no-files-found: error
