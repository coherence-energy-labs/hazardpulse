name: Earthquake Scoring

env:
  HAZARDPULSE_SIGNING_KEY: ${{ secrets.HAZARDPULSE_SIGNING_KEY }}

on:
  # Dispatched by scheduler.yml (scripts/ci/schedule.py), which decides when this scorer is due. Its own
  # cron was removed 2026-10-05: GitHub dropped or delayed most scheduled runs (measured in schedule.py).
  # Once per 6-hour slot (the forecast is stamped 00/06/12/18 UTC).
  workflow_dispatch:

concurrency:
  group: hazardpulse-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        # the branch tip at job start, not the commit that triggered the run: a run that waited in
        # the scoring concurrency queue otherwise starts stale and its push is rejected
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy
          pip install -e .
          python -c "from hazardpulse.earthquake.coherence_engine import extract_coherence_features; print('Import OK')"

      - name: Run earthquake scoring pipeline
        env:
          HAZARDPULSE_SLACK_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_SLACK_WEBHOOK_URL }}
          HAZARDPULSE_ALERT_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_ALERT_WEBHOOK_URL }}
        run: |
          python scripts/fetch_and_score_earthquake.py

      - name: Verify output
        run: |
          python -c "
          import json, pathlib

          # Check earthquake page was generated
          eq_page = pathlib.Path('dist/live/earthquake/index.html')
          assert eq_page.exists(), 'Missing earthquake page!'
          content = eq_page.read_text()
          assert '<h1' in content, 'Missing primary heading!'
          assert 'application/ld+json' in content, 'Missing structured data!'
          assert '/data/replay/' in content, 'Missing replay artifact link!'
          print(f'Earthquake page: {len(content)} bytes')

          # Check live-pulse.json was updated
          pulse = json.loads(pathlib.Path('dist/data/live-pulse.json').read_text())
          eq_entry = next((h for h in pulse['hazards'] if h['key'] == 'eq'), None)
          assert eq_entry is not None, 'Missing earthquake entry in live-pulse.json!'
          assert eq_entry.get('forecast_id'), 'Missing earthquake forecast_id!'
          print(f'EQ probability: {eq_entry.get(\"probability\", 0):.1%}')
          print(f'EQ risk band: {eq_entry.get(\"risk_band\", \"unknown\")}')
          print(f'EQ model: {eq_entry.get(\"model_version\", \"unknown\")}')

          # Check ledger
          ledger = pathlib.Path('dist/data/earthquake-ledger.jsonl')
          if ledger.exists():
              lines = ledger.read_text().strip().split('\\n')
              last = json.loads(lines[-1])
              print(f'Ledger entries: {len(lines)}')
              print(f'Last hash: {last[\"hash\"][:16]}...')

          evidence = pathlib.Path('dist/data/evidence/prediction-ledger.json')
          assert evidence.exists(), 'Missing evidence ledger!'

          print('Output verification passed.')
          "

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dist/ 2>/dev/null && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          MODEL=$(python -c "import json; print(next((h.get('model_version') for h in json.load(open('dist/data/live-pulse.json')).get('hazards', []) if h.get('key') == 'eq'), 'unknown'))")
          git commit -m "data: earthquake scoring update $(date -u +%Y-%m-%dT%H:%MZ)

          Automated scoring via fetch_and_score_earthquake.py.
          Model: ${MODEL} | Source: USGS FDSN catalog"
          bash scripts/ci/push_with_rebase.sh

      # a bot push does not trigger deploy.yml: without this the new forecast waits for some other
      # workflow's deploy (found 2026-10-03, when the S1 switch sat undeployed)
      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
