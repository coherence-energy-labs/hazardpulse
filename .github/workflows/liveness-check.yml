name: Liveness Check

# Runs every 4 hours and fails loudly if any of the three scorers has gone
# silent. "Silent" = live-pulse.json for that hazard hasn't refreshed within
# the expected cadence. This catches the class of bug where CI is green but
# forecasts have quietly stopped flowing.

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Per-hazard freshness, no fallback to the pulse-level timestamp (every scorer
      # rewrites that one, so the old inline check passed for four months while the
      # hurricane scorer was dead). Logic + tests: scripts/check_liveness.py,
      # tests/test_liveness.py.
      - name: Check scorer freshness
        run: python scripts/check_liveness.py
