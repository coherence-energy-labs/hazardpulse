name: Verification Scoring

env:
  HAZARDPULSE_SIGNING_KEY: ${{ secrets.HAZARDPULSE_SIGNING_KEY }}

on:
  # Attempts at off-peak minutes; the `due` job lets the scoring job run only when it is due (and
  # scheduler.yml dispatches it too, by the same rule). GitHub drops or delays many scheduled runs
  # (measured in scripts/ci/schedule.py), so no single cron slot is relied on.
  schedule:
    - cron: "33 * * * *"
  # Every 4 hours, so a model fix shows in the scores the same day.
  workflow_dispatch:

jobs:
  # seconds long, on a sparse checkout: is a scoring run due? (cron-triggered runs only; a manual or
  # scheduler dispatch always scores)
  due:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout (the gate and the latest pulse only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/schedule.py
            dist/data/live-pulse.json
          sparse-checkout-cone-mode: false
      - name: Is a run due?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/ci/schedule.py --hazard verification

  score:
    needs: due
    # a gate that failed to answer lets the run go: a duplicate costs a commit, a skip costs a forecast
    if: always() && (github.event_name != 'schedule' || needs.due.outputs.run == 'true' || needs.due.result == 'failure')
    # the shared queue holds scoring jobs only: a gate that found nothing due must never sit in it (a newly
    # queued run cancels the pending one in the same group)
    concurrency:
      group: hazardpulse-scoring
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        # the branch tip at job start, not the commit that triggered the run: a run that waited in
        # the scoring concurrency queue otherwise starts stale and its push is rejected
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy
          pip install -e .

      - name: Score earthquake forecasts
        run: python scripts/score_earthquake_prospective.py --emit-calibration

      - name: Score tornado forecasts
        run: python scripts/score_tornado_prospective.py --emit-calibration

      - name: Score hurricane forecasts
        run: python scripts/score_hurricane_prospective.py --emit-calibration

      - name: Score the v9.1 RI shadow against DTOPS (prospective test, docs/HURRICANE_RI_V9_PROGRAM.md)
        # running record until a look date (2026-12-01, 2027-12-01); the claim is made only at a look
        run: python scripts/score_hurricane_v9_prospective.py

      # every hurricane record: the hash chain holds, each entry still matches its replay file, and
      # every shadow recomputes from its stored inputs; a broken record fails this job
      - name: Audit the hurricane forecast records
        run: python scripts/audit_hurricane_records.py --strict

      # every tornado v3 forecast that stored its inputs recomputes exactly from them
      - name: Audit the tornado forecast records
        run: python scripts/audit_tornado_records.py --strict

      - name: Fit probability calibrators from matured forecasts
        # Turns the platform's own predictions-vs-outcomes into per-hazard
        # calibration constants (results/models/<hazard>_calibration.json). The
        # live scorers then start emitting calibrated forecasts + intervals +
        # signed receipts automatically. Prints measured ECE/BSS before -> after.
        run: python scripts/fit_calibration.py

      - name: Rebuild verification rollups from the new summaries
        # Binds results/verification/** and the served /verification data to the
        # summaries written above, in the same commit. Until 2026-10-01 nothing
        # committed results/verification/ and the tornado rollup said "0 scored,
        # no evaluator" while 1,737 forecasts had been scored (audit finding #4).
        # Exits 1 -- and so blocks the commit -- if a rollup would contradict its
        # prospective scorer's summary.
        run: python scripts/build_site_artifacts.py --verification-only

      - name: Show results
        run: |
          echo "=== Earthquake ==="
          cat results/earthquake_prospective/prospective_summary.json | python -m json.tool 2>/dev/null || true
          echo ""
          echo "=== Tornado ==="
          cat results/tornado_prospective/prospective_summary.json | python -m json.tool 2>/dev/null || true
          echo ""
          echo "=== Hurricane ==="
          cat results/hurricane_prospective/prospective_summary.json | python -m json.tool 2>/dev/null || true

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet results/ dist/data/tornado-recovery.json dist/data/verification/ dist/data/verification-summary.json dist/data/live-pulse.json 'dist/*.html' dist/sitemap.xml dist/feed.xml 2>/dev/null && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push verification results
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/earthquake_prospective/ results/tornado_prospective/ results/hurricane_prospective/ results/calibration/ results/verification/
          # every page: the site is rendered as one (hazardpulse.site.build), so any page the new summaries
          # touch -- track record, status, model evidence -- must ship in this commit (git's '*' spans directories)
          git add -f dist/data/tornado-recovery.json dist/data/verification/ dist/data/verification-summary.json dist/data/live-pulse.json 'dist/*.html' dist/sitemap.xml dist/feed.xml
          git commit -m "data: verification scoring update $(date -u +%Y-%m-%dT%H:%MZ)

          Automated prospective scoring of matured forecast replay artifacts.
          Sources: USGS FDSN (earthquake), SPC reports (tornado), NHC ATCF (hurricane)"
          bash scripts/ci/push_with_rebase.sh

      # a bot push does not trigger deploy.yml: the verification page and the model-evidence pages
      # this job re-renders reach the site only through this step
      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
