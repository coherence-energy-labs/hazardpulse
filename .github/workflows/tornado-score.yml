name: Tornado Scoring (Severe Season)

env:
  HAZARDPULSE_SIGNING_KEY: ${{ secrets.HAZARDPULSE_SIGNING_KEY }}

on:
  # Dispatched by scheduler.yml (scripts/ci/schedule.py), which decides when this scorer is due. Its own
  # cron was removed 2026-10-05: GitHub dropped or delayed most scheduled runs (measured in schedule.py).
  # Every 2 hours, every 30 minutes while tornado risk is elevated (a storm at 5% or more, or any NWS
  # tornado warning). A manual dispatch runs it at once.
  workflow_dispatch:
    inputs:
      date:
        description: "Date to score (YYYYMMDD, default: today)"
        required: false
        type: string

concurrency:
  group: hazardpulse-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        # the branch tip at job start, not the commit that triggered the run: a run that waited in
        # the scoring concurrency queue otherwise starts stale and its push is rejected
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy
          pip install -e .
          python -c "from hazardpulse.data.http import fetch_bytes; print('Import OK')"

      - name: Run tornado scoring pipeline
        env:
          HAZARDPULSE_HRRR_CACHE: ${{ github.workspace }}/.cache/hrrr
          HAZARDPULSE_PROBSEVERE_CACHE: ${{ github.workspace }}/.cache/probsevere
          HAZARDPULSE_SLACK_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_SLACK_WEBHOOK_URL }}
          HAZARDPULSE_ALERT_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_ALERT_WEBHOOK_URL }}
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          python scripts/fetch_and_score_tornado.py $DATE_ARG

      - name: Verify output
        run: |
          python -c "
          import json
          with open('dist/data/live-tornadoes.json') as f:
              d = json.load(f)
          print(f'Storms scored: {d.get(\"n_active_storms\", 0)}')
          print(f'Model: {d.get(\"model_version\", \"unknown\")}')
          print(f'Tier: {d.get(\"scoring_tier\", \"unknown\")}')
          print(f'Tier label: {d.get(\"scoring_tier_label\", \"unknown\")}')
          assert 'disclaimer' in d, 'Missing disclaimer!'
          print('Output verification passed.')
          "

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dist/ 2>/dev/null && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          MODEL=$(python -c "import json; print(json.load(open('dist/data/live-tornadoes.json')).get('model_version', 'unknown'))")
          git commit -m "data: tornado scoring update $(date -u +%Y-%m-%dT%H:%MZ)

          Automated scoring via fetch_and_score_tornado.py.
          Model: ${MODEL} | Sources: ProbSevere v3, NWS warnings"
          bash scripts/ci/push_with_rebase.sh

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
