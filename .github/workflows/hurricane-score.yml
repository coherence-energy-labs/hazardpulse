name: Hurricane Scoring (every NHC cycle)

env:
  HAZARDPULSE_SIGNING_KEY: ${{ secrets.HAZARDPULSE_SIGNING_KEY }}

on:
  schedule:
    # Each NHC cycle (00/06/12/18Z) brings new NOAA RI guidance, served from that cycle's SHIPS
    # text. Its publication lag, measured 2026-10-02 over 1,017 files of the 2026 season (last-
    # modified minus synoptic time): p05 30 min, median 53, p90 115, p99 372. At the old 12:00 run
    # the newest analysis was published before its SHIPS text, so NHC storms fell back to v8.2;
    # at +2 h 10 min ~91% of texts are out. Off the hour: the scorers share one queue and the
    # tornado scorer runs on every even hour.
    - cron: "10 2,8,14,20 * * *"
  workflow_dispatch:

concurrency:
  group: hazardpulse-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy
          pip install -e .

      # Serves the pinned model (results/models/hurricane_ri_v8_1.json); it no longer trains.
      # Retraining inside this job is what got every run since 2026-05-27 cancelled by the
      # 10-minute budget with no output. `-u` streams progress live; the step timeout turns a
      # hang into a FAILED step (which notifies) instead of a silently CANCELLED job.
      - name: Run hurricane scoring pipeline
        timeout-minutes: 6
        env:
          HAZARDPULSE_SLACK_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_SLACK_WEBHOOK_URL }}
          HAZARDPULSE_ALERT_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_ALERT_WEBHOOK_URL }}
        run: python -u scripts/fetch_and_score.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dist/ 2>/dev/null && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "data: hurricane scoring update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
