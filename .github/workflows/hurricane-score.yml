name: Hurricane Scoring (Daily)

env:
  HAZARDPULSE_SIGNING_KEY: ${{ secrets.HAZARDPULSE_SIGNING_KEY }}

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: hazardpulse-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy
          pip install -e .

      - name: Run hurricane scoring pipeline
        env:
          HAZARDPULSE_SLACK_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_SLACK_WEBHOOK_URL }}
          HAZARDPULSE_ALERT_WEBHOOK_URL: ${{ secrets.HAZARDPULSE_ALERT_WEBHOOK_URL }}
        run: python scripts/fetch_and_score.py

      # This job commits `dist/` wholesale, which contains earthquake-ledger.jsonl and
      # tornado-ledger.jsonl. It does not intend to touch them, but a wholesale add cannot
      # tell intent from effect -- so the same gate the scoring jobs run must run here too,
      # or hurricane is an unguarded path to publishing a rewritten ledger.
      - name: Ledger hash chain must verify before publishing
        run: python scripts/verify_ledger_chain.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dist/ 2>/dev/null && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "data: hurricane scoring update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
