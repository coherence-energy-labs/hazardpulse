name: Scheduler

# The one clock for the scorers. GitHub's cron dropped or delayed most scheduled scoring runs (2026-10-01
# to 05: a 2-hour tornado cron ran every 5.5 h at the median, the hurricane scorer went 23 h without a
# run with three storms active), so the scorers have no cron of their own: this job runs at four off-peak
# minutes an hour, works out from the run history which scorer is due, and dispatches it.
# The rules are in scripts/ci/schedule.py; tests/test_scheduler.py pins them.
#
# The clock itself does not depend on GitHub's cron either. On 2026-10-05 the cron fired NO run of any
# workflow here from 12:34Z to past 17:00Z, while a dispatched run started within seconds. So every run
# ends by dispatching the next one ~10 minutes later: a chain of runs that needs nothing but dispatch. The
# concurrency group keeps it to ONE chain -- it holds one running and one pending run, and a newer pending
# run cancels an older one -- so a cron run that slips in merges into the chain instead of starting a second,
# and if the chain ever breaks (a runner lost mid-sleep), the next cron run that fires restarts it. No
# credential is needed (GITHUB_TOKEN may dispatch workflows) and nothing runs on anyone's computer. The
# production Worker's Cloudflare cron (src/worker.js) is a third clock, dormant until GH_DISPATCH_TOKEN is set.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # only the script and the latest pulse: the full repository is ~200 MB and checking it out took
      # 83 s of every tornado run
      - name: Checkout (the scheduler and the latest pulse only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/schedule.py
            dist/data/live-pulse.json
          sparse-checkout-cone-mode: false

      - name: Dispatch the scorers that are due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/ci/schedule.py

      # the next tick: even when this one failed, or the chain stops (if: always())
      - name: Dispatch the next tick in ~10 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 540
          for attempt in 1 2 3; do
            gh workflow run scheduler.yml --ref main && exit 0
            sleep 20
          done
          echo "::error::could not dispatch the next tick; the next cron run restarts the chain"
          exit 1
