name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Ensure dist directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "dist directory is missing. Build your site output before deploy."
            exit 1
          fi

      - name: Run site integrity checks
        run: python -m pytest tests/test_site_integrity.py -q

      - name: Validate the Worker and the page script
        run: |
          node --check src/worker.js
          node --check dist/assets/app.js

      # what the edge does with the agencies' feeds: unknown is never zero, a dead or hanging agency cannot
      # stall a page, agency text is escaped, and every public route is in the published contracts
      - name: Worker checks
        run: node tests/worker_api_check.mjs

      - name: Deploy preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --env preview

  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Ensure dist directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "dist directory is missing. Build your site output before deploy."
            exit 1
          fi

      - name: Run site integrity checks
        run: python -m pytest tests/test_site_integrity.py -q

      - name: Validate the Worker and the page script
        run: |
          node --check src/worker.js
          node --check dist/assets/app.js

      # what the edge does with the agencies' feeds: unknown is never zero, a dead or hanging agency cannot
      # stall a page, agency text is escaped, and every public route is in the published contracts
      - name: Worker checks
        run: node tests/worker_api_check.mjs

      - name: Deploy production to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

