name: Earthquake Monthly Retrain

# Continuous learning: fold every newly-captured earthquake into the model.
# retrain_and_deploy.py honestly tunes, gates on a temporal holdout (never-worse), trains
# the winner on ALL data, and overwrites the deployed earthquake_gbt_v1.json.
#
# STATUS (2026-10-01): MANUAL ONLY -- there is no runner that can take this job.
#   `gh api repos/coherence-energy-labs/hazardpulse/actions/runners` -> total_count 0 (the org
#   has none either). Both scheduled runs ever made (2026-09-01, 2026-10-01) sat queued for
#   24 h and were cancelled by GitHub -- "cancelled", so nobody was notified, and the model was
#   never retrained by CI. The monthly cron is therefore removed rather than left implying a
#   learning loop that does not exist. Retrain locally on the 24-core box:
#       python scripts/retrain_and_deploy.py --hazard earthquake --max-year <YYYY> --deploy
#
# To make it automatic again (needs the repo owner):
#   1. Register a runner on the box with the dedicated label (token from the repo's
#      Settings > Actions > Runners > New self-hosted runner):
#        config.cmd --url https://github.com/coherence-energy-labs/hazardpulse --token <TOKEN> --labels hazardpulse-retrain
#      (the label keeps this 4-hour CPU job off any other self-hosted runner).
#   2. The runner works in its OWN checkout (_work/...), not the checkout that holds
#      .cache/earthquake and the sibling omega_one repo, so point those at it (junction the
#      cache into the workspace) or the extraction runs cold and omega_one is skipped.
#   3. Restore the trigger:   schedule: [ { cron: "0 7 1 * *" } ]
# Steps use bash explicitly so they behave the same on the Windows box (Git Bash) as on Linux.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the winner (overwrite the live model)"
        type: boolean
        default: true

concurrency:
  group: hazardpulse-retrain-earthquake
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: [self-hosted, hazardpulse-retrain]
    timeout-minutes: 240
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy xgboost lightgbm
          pip install -e .

      - name: Refresh catalog to present + retrain + deploy
        env:
          # rebuild features so newly captured earthquakes flow in
          HAZARDPULSE_EQ_FEATURE_REBUILD: "1"
        run: |
          YEAR=$(date -u +%Y)
          python scripts/retrain_and_deploy.py --hazard earthquake --max-year "$YEAR" \
            ${{ (github.event_name == 'schedule' || inputs.deploy) && '--deploy' || '' }}

      - name: Show retrain report
        run: |
          python -c "import json; print(json.dumps(json.load(open('results/calibration/earthquake_retrain_report.json')), indent=2))"

      - name: Commit retrained model if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- results/models/earthquake_gbt_v1.json results/calibration/earthquake_retrain_report.json; then
            echo "No model change."
          else
            git add -f results/models/earthquake_gbt_v1.json
            git add results/calibration/earthquake_retrain_report.json
            git commit -m "model: monthly earthquake retrain on all captured data $(date -u +%Y-%m)

          Automated via retrain_and_deploy.py: honest val-tune -> never-worse gate ->
          train-on-all -> redeploy. Continuous learning from the growing USGS catalog."
            git push
          fi
