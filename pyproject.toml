[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hazardpulse"
version = "0.1.0"
description = "Unified natural hazard prediction from coherence field theory"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Josh Philbrick", email = "josh@coherenceenergylabs.com" },
]
keywords = [
    "earthquake prediction",
    "hurricane prediction",
    "tornado prediction",
    "natural hazards",
    "coherence field",
    "Helmholtz PDE",
    "geophysics",
    "meteorology",
    "seismology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "zarr>=2.17,<3",
    "numcodecs>=0.11,<0.17",
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    # Ed25519 signing/verification for the trust layer (signed, re-runnable
    # forecast receipts). Vendored omega_one trust subset imports it lazily.
    "cryptography>=42.0",
    # NOAA GMGSI infrared (netCDF4/HDF5) for the hurricane RI v10.3 IR features
    "h5py>=3.8",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.1"]
all = ["hazardpulse[viz,dev]"]

[project.scripts]
hazardpulse = "hazardpulse.cli:main"

[project.urls]
Homepage = "https://github.com/coherence-energy-labs/hazardpulse"
Documentation = "https://github.com/coherence-energy-labs/hazardpulse/tree/main/docs"
Repository = "https://github.com/coherence-energy-labs/hazardpulse"
Issues = "https://github.com/coherence-energy-labs/hazardpulse/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hazardpulse"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
